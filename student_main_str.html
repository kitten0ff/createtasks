    <script>
    //Форматирование даты
    function formatDate(dateString) {
        if (!dateString) return '';
        
        //Вид для года, месяца и дня
        const options = { 
            year: 'numeric', 
            month: 'long', //Полное название месяца
            day: 'numeric'
        };
        
        try {
            const date = new Date(dateString.replace(' ', 'T'));
            return date.toLocaleDateString('ru-RU', options);
        } catch (e) {
            console.error('Ошибка форматирования даты:', e);
            return dateString; 
        }
    }

    //Форматирование всех дат на странице
    function processAllDates() {
        document.querySelectorAll('.test-date').forEach(el => {
            const dateString = el.getAttribute('data-date');
            el.textContent = formatDate(dateString);
        });
    }

    //Вывод всей инфы о тесте в модальном окне
    function openModal(testData) {
        if (typeof testData === 'string') {
            testData = JSON.parse(testData);
        }
        
        document.getElementById('modal-name').textContent = testData.name;
        document.getElementById('modal-description').textContent = testData.description;
        document.getElementById('modal-quantity').textContent = testData.quantity;
        document.getElementById('modal-date').textContent = formatDate(testData.date_creat);
        document.getElementById('modal-time').textContent = formatTestTime(testData.time);
        document.getElementById('modal-author').textContent = testData.ename;
        document.getElementById('modal-subject').textContent = testData.subject_name;
        
        window.currentTestId = testData.id;
        
        const modal = document.getElementById('question-modal');
        modal.classList.add('active');
    }

    function closeModal() {
        const modal = document.getElementById('question-modal');
        modal.classList.remove('active');
    }

    //Начало решения теста
    function startTestSolution() {
        if (window.currentTestId) {
            document.cookie = `current_test_id=${window.currentTestId}; path=/`;
            window.location.href = "student_solution_str.php";
        }
    }

    function formatTestTime(timeString) {
        if (!timeString || timeString === '00:00');
        
        const [hours, minutes] = timeString.split(':').map(Number);
        let result = '';
        
        if (hours > 0) {
            result += hours + ' ' + getHoursWord(hours);
        }
        
        if (minutes > 0) {
            if (hours > 0) result += ' ';
            result += minutes + ' ' + getMinutesWord(minutes);
        }
        
        return result;
    }

    function getHoursWord(hours) {
        const lastDigit = hours % 10;
        const lastTwoDigits = hours % 100;
        
        if (lastTwoDigits >= 11 && lastTwoDigits <= 19) return 'часов';
        if (lastDigit === 1) return 'час';
        if (lastDigit >= 2 && lastDigit <= 4) return 'часа';
        return 'часов';
    }

    function getMinutesWord(minutes) {
        const lastDigit = minutes % 10;
        const lastTwoDigits = minutes % 100;
        
        if (lastTwoDigits >= 11 && lastTwoDigits <= 19) return 'минут';
        if (lastDigit === 1) return 'минута';
        if (lastDigit >= 2 && lastDigit <= 4) return 'минуты';
        return 'минут';
    }

    // Глобальная переменная для хранения состояния тестов
    let hasTests = false;

    // Проверка наличия тестов
    function checkTests(filtered = false) {
        const container = document.getElementById('tests-container');
        const testBlocks = container.querySelectorAll('.form_content_block');
        const noTestsMessage = container.querySelector('.tests_message');
        
        // Определяем количество видимых тестов
        const visibleTests = filtered 
            ? Array.from(testBlocks).filter(b => b.style.display !== 'none').length
            : testBlocks.length;

        // Управляем сообщением в зависимости от результатов
        if (visibleTests === 0) {
            const messageText = filtered 
                ? 'Тесты не найдены. Попробуйте изменить параметры фильтрации.'
                : 'Нет доступных тестов';
            
            if (noTestsMessage) {
                noTestsMessage.textContent = messageText;
                noTestsMessage.style.display = 'block';
            } else {
                const message = document.createElement('div');
                message.className = 'tests_message';
                message.textContent = messageText;
                container.appendChild(message);
            }
        } else if (noTestsMessage) {
            noTestsMessage.style.display = 'none';
        }
        
        // Обновляем глобальное состояние
        hasTests = testBlocks.length > 0;
    }

    function resetFilters() {
        // Сбрасываем значения фильтров
        document.getElementById('status-filter').value = '';
        document.getElementById('subject-filter').value = '';
        document.getElementById('sort-order').value = 'newest';
        
        // Показываем все тесты
        const testBlocks = document.querySelectorAll('#tests-container .form_content_block');
        testBlocks.forEach(block => block.style.display = 'flex');
        
        // Проверяем тесты и сортируем
        checkTests(false);
        if (hasTests) sortTests('newest');
    }

    function applyFilters() {
        if (!hasTests) return;
        
        const subject = document.getElementById('subject-filter').value;
        const status = document.getElementById('status-filter').value;
        const sortOrder = document.getElementById('sort-order').value;
        
        // Применяем фильтры
        document.querySelectorAll('#tests-container .form_content_block').forEach(block => {
            const showBlock = (subject === '' || block.dataset.subject === subject) &&
                            (status === '' || block.dataset.status === status);
            block.style.display = showBlock ? 'flex' : 'none';
        });
        
        // Проверяем результаты фильтрации и сортируем
        checkTests(true);
        if (hasTests) sortTests(sortOrder);
    }

    // Сортировка тестов (сначала новые)
    function sortTests(order = 'newest') {
        const container = document.getElementById('tests-container');
        const blocks = Array.from(container.querySelectorAll('.form_content_block'));
        
        blocks.sort((a, b) => {
            const dateA = new Date(a.getAttribute('data-date'));
            const dateB = new Date(b.getAttribute('data-date'));
            return order === 'newest' ? dateB - dateA : dateA - dateB;
        });
        
        blocks.forEach(block => container.appendChild(block));
    }

    // Инициализация страницы
    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('sname').textContent = getCookie("sname");
        processAllDates();

        // Скрываем сообщение на время инициализации
        const noTestsMessage = document.querySelector('.tests_message');
        if (noTestsMessage) noTestsMessage.style.display = 'none';
        
        // Проверяем тесты после небольшой задержки
        checkTests(false);
        sortTests('newest');
    });

    //Получаем значение cookie по имени
    function getCookie(name) {
        let matches = document.cookie.match(new RegExp(
            "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
        ));
        return matches ? decodeURIComponent(matches[1]) : undefined;
    }
    </script>
